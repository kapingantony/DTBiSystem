{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}<a class="btn btn-outline btn-sm" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">Previous</a>{% else %}<span class="btn btn-outline btn-sm disabled" aria-disabled="true">Previous</span>{% endif %}
    <span class="pagination-status">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} &middot; {{ page_obj.paginator.count }} records</span>
    {% if page_obj.has_next %}<a class="btn btn-outline btn-sm" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Next</a>{% else %}<span class="btn btn-outline btn-sm disabled" aria-disabled="true">Next</span>{% endif %}
</nav>
{% endif %}
